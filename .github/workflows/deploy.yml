# Deploy: push to main ONLY. Runs in the `production` environment, which must have
# required reviewers configured (repo Settings -> Environments -> production ->
# Required reviewers). That is the approval gate: merges queue up, a human approves
# the production deployment, then migrate + deploy run.
# Required secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
# Required Worker secrets (created once via `wrangler secret put`):
# API_TOKEN, TEAM_DOMAIN, POLICY_AUD, CLOUDFLARE_API_TOKEN.
name: deploy

on:
  push:
    branches: [main]

jobs:
  production:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install
        working-directory: dashboard
        run: npm ci --no-audit --no-fund
      - name: Remote D1 migrations (0001-0005)
        working-directory: dashboard
        run: npm run db:migrate:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: dashboard
          command: deploy
