# Deploy: push to main ONLY. Runs in the `production` environment; configure Required
# reviewers there (Settings -> Environments -> production) and that IS the approval gate.
# Repo root IS the app (no dashboard/ prefix).
# Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
# Worker secrets (one-time, interactive): API_TOKEN, TEAM_DOMAIN, POLICY_AUD, CLOUDFLARE_API_TOKEN.
#   npx wrangler secret put <NAME>
# NOTE (AUDIT.md risk R5): once Access protects the Worker, CLI calls may need a Service
# Auth policy or an Access bypass. Confirm on first run before assuming green.
name: deploy

on:
  push:
    branches: [main]

jobs:
  production:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Remote D1 migrations (0001-0005)
        run: npm run db:migrate:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy