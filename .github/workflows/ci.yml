# CI: PR gate. Repo root IS the app (no dashboard/ prefix — that was a bug, fixed).
# Blocking gates: astro build (real gate), bundle gates, deploy --dry-run.
# typecheck:owned blocks on files we authored (post astro sync for astro:middleware types).
# typecheck:full is informational: upstream template ships ~109 pre-existing errors
# (tanstack-table generics, D1 Serializable, implicit-any in its own routes). See AUDIT.md.
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Typecheck (owned files)
        run: npm run typecheck:owned
      - name: Typecheck (full, informational — upstream baseline)
        if: always()
        continue-on-error: true
        run: npm run typecheck:full
      - name: Bundle gates (chat UI, middleware)
        run: |
          npx esbuild --bundle src/components/admin/chat-panel.tsx --format=esm --platform=browser --jsx=automatic --outfile=/dev/null
          npx esbuild --bundle src/middleware.ts --format=esm --platform=neutral --packages=external --external:astro:middleware --outfile=/dev/null
      - name: Build (Astro SSR)
        run: npm run build
      - name: Deploy dry-run (validates config/packaging, deploys nothing)
        run: npm run wrangler:wrapper && npx wrangler deploy --dry-run
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}